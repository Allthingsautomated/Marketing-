<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{% block title %}ATA Leads{% endblock %} — All Things Automated</title>

  <!-- PWA / iOS -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ATA Leads" />

  <!-- Apple touch icons -->
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/static/icons/icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/static/icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180.png" />

  <!-- Favicon -->
  <link rel="icon" href="/static/favicon.ico" />

  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <div>
        <div class="logo-text">All Things Automated</div>
        <div class="logo-sub">Lead Engine</div>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
        <span class="icon">📊</span> Dashboard
      </a></li>
      <li><a href="/leads" class="nav-link {% if request.url.path.startswith('/leads') %}active{% endif %}">
        <span class="icon">🏗️</span> All Leads
      </a></li>
      <li><a href="/search" class="nav-link {% if request.url.path == '/search' %}active{% endif %}">
        <span class="icon">🔍</span> Run Search
      </a></li>
      <li><a href="/api/leads/export/csv" class="nav-link">
        <span class="icon">📥</span> Export CSV
      </a></li>
    </ul>
    <div class="sidebar-footer">
      Jorge Romero · Sarasota FL
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="top-actions">{% block top_actions %}{% endblock %}</div>
    </div>
    <div class="content-area">
      {% block content %}{% endblock %}
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
